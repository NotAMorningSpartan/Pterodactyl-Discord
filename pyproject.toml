[project]
name = "pterodactyl-discord-bot"
version = "0.1.0"
description = "Discord bot for controlling Pterodactyl panel server power states."
authors = [
    { name = "Tyler Kness-Miller", email = "tylerkm75@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bot"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
